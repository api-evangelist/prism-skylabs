description: Prism Skylabs was a cloud-based visual monitoring and video analytics company that
  turned surveillance and IP-camera feeds from physical retail and commercial spaces into searchable,
  time-lapse imagery and business intelligence. Backed by a16z and Draper Nexus, it was acquired by
  Cisco in 2016 and folded into the Cisco Meraki smart-camera (MV) computer-vision line; the standalone
  company is defunct. The prismskylabs.com domain now 301-redirects to prism.com, an unrelated
  domain-licensing/holding page, and no live Prism Skylabs developer portal, API documentation, or API
  specifications exist to enrich. This profile is retained as an a16z portfolio identity record.
